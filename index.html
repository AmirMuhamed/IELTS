<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#eef0f5;--mu:#9aa3b5;--pr:#6b95ff;--ok:#4cc37f;--no:#ff7676;--bd:#2c3342}}

.g{display:grid;gap:10px}.lec{text-align:right;display:flex;justify-content:space-between;align-items:center}.lec b{color:var(--pr)}
.all{background:var(--pr);color:#fff;border:0;width:100%;margin-top:6px}

.r .t{direction:ltr;text-align:left;font-weight:600}.r small{display:block;color:var(--mu)}.tag{font-weight:700}.ok .tag{color:var(--ok)}.no .tag{color:var(--no)}
