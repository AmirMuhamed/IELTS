<!DOCTYPE html>

<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#eef0f5;--mu:#9aa3b5;--pr:#6b95ff;--ok:#4cc37f;--no:#ff7676;--bd:#2c3342}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
.w{max-width:680px;margin:0 auto;padding:20px 16px}h1{font-size:1.5rem;margin:.3em 0}p.s{color:var(--mu);margin-top:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 16px}
.g{display:grid;gap:10px}.lec{text-align:right;display:flex;justify-content:space-between;align-items:center}.lec b{color:var(--pr)}
.all{background:var(--pr);color:#fff;border:0;width:100%;margin-top:6px}
.q{font-size:1.15rem;direction:ltr;text-align:left;margin:14px 0}.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf button{padding:16px;font-weight:600}.tf .sel{background:var(--pr);color:#fff;border-color:var(--pr)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:8px}
.nav{display:flex;justify-content:space-between;margin-top:14px}.nav .p{background:var(--pr);color:#fff;border:0}.nav button:disabled{opacity:.4}
.cnt{display:flex;gap:8px;margin:10px 0}.cnt button{flex:1;min-width:0;padding:10px 4px;font-weight:600}.cnt .sel{background:var(--pr);color:#fff;border-color:var(--pr)}
.sc{font-size:3rem;font-weight:700;text-align:center;color:var(--pr)}.r{border-inline-start:5px solid var(--bd)}.r.ok{border-color:var(--ok)}.r.no{border-color:var(--no)}
.r .t{direction:ltr;text-align:left;font-weight:600}.r small{display:block;color:var(--mu)}.tag{font-weight:700}.ok .tag{color:var(--ok)}.no .tag{color:var(--no)}

.vg{display:flex;flex-direction:column;gap:6px;text-align:right;width:100%;margin:8px 0}.vg b{color:var(--pr)}.vg .vw{direction:ltr;text-align:left;color:var(--mu);font-size:.85rem}.vg.sel{box-shadow:inset 0 0 0 2px var(--pr)}
.vh{margin:18px 0 4px;color:var(--mu);font-size:.95rem}.vrow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--bd)}.vrow:last-child{border:0}.vrow b{direction:ltr;text-align:left}.vrow span{text-align:right}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}.opts button{padding:13px 6px;font-weight:600}.opts .sel{background:var(--pr);color:#fff;border-color:var(--pr)}
.vbar{display:flex;gap:8px;margin:10px 0}.vbar button{flex:1}.pri{background:var(--pr);color:#fff;border:0;width:100%;margin-top:10px}.pri:disabled{opacity:.4}
</style></head><body><div class="w" id="app"></div>

const $=document.getElementById("app");let S;
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const tag=(l,i)=>l.q.map(([t,a])=>({t,a,lec:l.n+" "+l.t}));
let N=20;function setN(n){N=n;home()}
function home(){S=null;$.innerHTML=`<h1>امتحان IELTS – صح / غلط</h1><p class="s">اختر عدد الأسئلة ثم المحاضرة. الأسئلة عشوائية من بنك الأسئلة.</p><div class="cnt">${[10,20,30,40,50].map(n=>`<button class="${n===N?"sel":""}" onclick="setN(${n})">${n}</button>`).join("")}</div><div class="g">`+LECS.map((l,i)=>`<button class="lec card" onclick="start(${i})"><span><b>${l.n}</b> – ${l.t}</span><span>${N} سؤال</span></button>`).join("")+`</div><button class="all card" onclick="start(-1)">امتحان شامل – ${N} سؤال (موزعة بالتساوي على المحاضرات)</button><button class="all card" style="margin-top:12px" onclick="vHome()">📚 مفردات Academic Word List (Sublist 6 &amp; 7)</button>`}
function start(i){let qs;if(i<0){const o=sh([0,1,2,3]);qs=sh(LECS.flatMap((l,k)=>sh(tag(l)).slice(0,Math.floor(N/4)+(o.indexOf(k)<N%4?1:0))))}else qs=sh(tag(LECS[i])).slice(0,N);S={qs,ans:Array(qs.length).fill(null),i:0,title:i<0?"امتحان شامل":LECS[i].n+" – "+LECS[i].t};q()}
function q(){const x=S.qs[S.i],a=S.ans[S.i],n=S.qs.length;$.innerHTML=`<div class="top"><span>${S.title}</span><span>${S.i+1} / ${n}</span></div><div class="bar"><i style="width:${(S.i+1)/n*100}%"></i></div><div class="card"><small style="color:var(--mu)">${x.lec}</small><div class="q">${x.t}</div><div class="tf"><button class="${a===1?"sel":""}" onclick="pick(1)">True ✔ صح</button><button class="${a===0?"sel":""}" onclick="pick(0)">False ✘ غلط</button></div></div><div class="nav"><button onclick="go(-1)" ${S.i?"":"disabled"}>السابق</button>${S.i<n-1?`<button class="p" onclick="go(1)">التالي</button>`:`<button class="p" onclick="fin()">إنهاء وعرض النتيجة</button>`}</div>`}
function pick(v){S.ans[S.i]=v;q()}function go(d){S.i+=d;q()}
function fin(){const un=S.ans.filter(a=>a===null).length;if(un&&!confirm(`لديك ${un} سؤال بدون إجابة. إنهاء؟`))return;const sc=S.qs.filter((x,i)=>S.ans[i]===x.a).length;
